  <!-- Top Metadata Header (Monospace Swiss Precision) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Segoe UI Mono', 'Roboto Mono', monospace" font-size="11" letter-spacing="2" fill="#52525b">
