<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d0d16"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow_purple" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow_blue" cx="20%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="border_grad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg_grad)"/>
  <rect width="1200" height="420" fill="url(#glow_purple)"/>
  <rect width="1200" height="420" fill="url(#glow_blue)"/>

  <!-- Delicate Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" stroke-dasharray="4 8"/>
    <line x1="0" y1="140" x2="1200" y2="140" stroke-dasharray="4 8"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke-dasharray="4 8"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4 8"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke-dasharray="4 8"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke-dasharray="4 8"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke-dasharray="4 8"/>
    <line x1="800" y1="0" x2="800" y2="420" stroke-dasharray="4 8"/>
    <line x1="1000" y1="0" x2="1000" y2="420" stroke-dasharray="4 8"/>
  </g>

  <!-- Card Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" stroke="url(#border_grad)" stroke-width="1.5" fill="none"/>

  <!-- Architectural Geometric Monogram (Folded Isometric 'N') -->
  <g transform="translate(565, 52)">
    <!-- Left Pillar -->
    <path d="M0 56 L24 42 L24 14 L0 28 Z" fill="#6366f1" opacity="0.9"/>
    <!-- Diagonal Fold -->
    <path d="M24 14 L46 56 L46 28 L24 0 Z" fill="url(#accent_grad)"/>
    <!-- Right Pillar -->
    <path d="M46 28 L70 14 L70 42 L46 56 Z" fill="#8b5cf6" opacity="0.8"/>
    <!-- Top Cap High-light -->
    <path d="M24 0 L46 28 L24 42 L0 28 Z" fill="#c4b5fd" opacity="0.3"/>
  </g>

  <!-- Brand Typography -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="82" letter-spacing="14" fill="url(#title_grad)">
    NOMIK
  </text>

  <!-- Primary Subtitle -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" letter-spacing="4" fill="#a1a1aa">
    THE BILLION-DOLLAR BRAND NAMING &amp; DOMAIN ENGINE
  </text>

  <!-- Origin Hook / Dogfooding Pill -->
  <g transform="translate(600, 275)">
    <rect x="-240" y="0" width="480" height="32" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1" opacity="0.9"/>
    <circle cx="-218" cy="16" r="4" fill="#10b981"/>
    <text x="0" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" letter-spacing="0.5">
      The AI naming skill that named itself through its own engine
    </text>
  </g>

  <!-- Feature Pills Footer -->
  <g transform="translate(190, 345)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="#12121a" stroke="#27272a" stroke-width="1"/>
      <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#a1a1aa">
        7 Agency Taxonomies
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="185" height="34" rx="17" fill="#12121a" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
      <text x="92" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f87171">
        Zero AI Slop Certified
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(395, 0)">
      <rect width="195" height="34" rx="17" fill="#12121a" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="97" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c4b5fd">
        Real-Time ICANN RDAP
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(605, 0)">
      <rect width="215" height="34" rx="17" fill="#12121a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="107" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">
        Cognitive Phonosemantics
      </text>
    </g>
  </g>
</svg>
